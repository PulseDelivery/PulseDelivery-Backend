version: '3.8'

services:
  postgresdb:
    image: postgres:17
    container_name: pulsedelivery-postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Password123*
      - POSTGRES_DB=IdentityDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pulsedelivery-rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
  
  mongodb:
    image: mongo:latest
    container_name: pulsedelivery-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: